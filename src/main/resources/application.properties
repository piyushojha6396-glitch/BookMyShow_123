spring.application.name=BMS
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

# ---------- Database (secrets come from the environment, never from git) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/BMS?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1500000

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# ---------- Web ----------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------- Actuator (health is public, everything else is ADMIN only) ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---------- Logging ----------
logging.pattern.level=%5p [%X{requestId:-}]

# ---------- Application ----------
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.issuer=BMS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.booking.max-seats-per-booking=${BOOKING_MAX_SEATS:10}
app.booking.cancellation-window-hours=${BOOKING_CANCEL_WINDOW_HOURS:2}
app.admin.name=${APP_ADMIN_NAME:Administrator}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
