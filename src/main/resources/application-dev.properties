# Local development only. Real values still come from environment variables where possible.
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
logging.level.com.cfs.BMS=DEBUG
management.endpoint.health.show-details=always

# INSECURE default so the app boots locally - production must set JWT_SECRET.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}

# Development bootstrap admin. Override these values with APP_ADMIN_EMAIL and
# APP_ADMIN_PASSWORD before sharing the development environment.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
